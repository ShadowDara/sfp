[package]
name = "fling-lsp"
version = "0.1.0"
edition = "2021"
description = "Language Server (LSP) for the Fling scripting language"
license = "MIT"

[lib]
name = "fling_lsp"
path = "src/lib.rs"

[[bin]]
name = "fling-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
once_cell = "1"
# Pin transitive deps that have bumped their MSRV past what our toolchain
# (rustc 1.75, from apt) supports -- newer idna/icu releases require newer
# rustc / the unstable `edition2024` Cargo feature. url 2.4.x uses the older
# idna 0.4 (unicode-bidi/unicode-normalization based), avoiding the icu_*
# crates entirely.
url = "=2.4.1"

[profile.release]
opt-level = 2
